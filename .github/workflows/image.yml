name: Build Webby image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push image to GHCR
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          load: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
          tags: ghcr.io/${{ github.repository }}:webby-${{ github.sha }}
          platforms: linux/amd64
      - name: Smoke check image
        if: github.event_name != 'workflow_dispatch' || !inputs.publish
        run: |
          docker run --rm --entrypoint sh ghcr.io/${{ github.repository }}:webby-${{ github.sha }} -c 'command -v gh && command -v git && command -v webby-github-login && test -s /opt/plow/prompt/AGENTS.md && test -s /opt/plow/skills/webby-github/SKILL.md'
