name: Check Webby website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check_site.py'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check_site.py'
      - '.github/workflows/site.yml'
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_site.py
